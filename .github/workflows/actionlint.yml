name: actionlint

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Dependabot (github-actions ecosystem) が自動で PR を出す。
on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    uses: genzouw/ci-workflows/.github/workflows/actionlint.yml@3b5b97441e8d804aa75728d6816e55c4f78e0080 # v1.0.0
